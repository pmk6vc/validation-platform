# notification-service: Kafka consumer + webhook caller
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
    spec:
      containers:
        - name: notification-service
          image: docker.io/library/test-notification-service:latest
          imagePullPolicy: Never
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.infrastructure.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: order-events
            - name: KAFKA_GROUP_ID
              value: notification-service
            - name: WEBHOOK_URL
              value: http://webhook-stub.external.svc.cluster.local:8080/webhook
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: production
  labels:
    app: notification-service
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    team: notifications
  annotations:
    description: Notification service - consumes order events, sends webhooks
spec:
  type: ClusterIP
  selector:
    app: notification-service
    version: v1
  ports:
    - name: http
      port: 8080
      targetPort: 8080