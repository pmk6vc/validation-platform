apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
    spec:
      containers:
        - name: api-gateway
          image: docker.io/library/test-api-gateway:latest
          imagePullPolicy: Never  # Use local image
          env:
            - name: POSTGRES_HOST
              value: postgresql.infrastructure.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: testdb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: testpass
            - name: REDIS_HOST
              value: redis.infrastructure.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: production
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/version: "1.5.0"
    app.kubernetes.io/component: gateway
    team: backend
  annotations:
    description: API Gateway service
    owner: backend-team@company.com
spec:
  type: NodePort
  selector:
    app: api-gateway
    version: v1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080