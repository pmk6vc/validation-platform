apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Point all test-service images at Artifact Registry.
# Registry: us-central1-docker.pkg.dev/zugzwang-381922/validation
images:
  - name: docker.io/library/test-api-gateway
    newName: us-central1-docker.pkg.dev/zugzwang-381922/validation/test-api-gateway
    newTag: latest
  - name: docker.io/library/test-order-service
    newName: us-central1-docker.pkg.dev/zugzwang-381922/validation/test-order-service
    newTag: latest
  - name: docker.io/library/test-notification-service
    newName: us-central1-docker.pkg.dev/zugzwang-381922/validation/test-notification-service
    newTag: latest
  - name: docker.io/library/test-traffic-generator
    newName: us-central1-docker.pkg.dev/zugzwang-381922/validation/test-traffic-generator
    newTag: latest
  - name: docker.io/library/test-webhook-stub
    newName: us-central1-docker.pkg.dev/zugzwang-381922/validation/test-webhook-stub
    newTag: latest

# Override imagePullPolicy from Never (minikube) to Always (GKE) for all deployments
patches:
  - target:
      kind: Deployment
      namespace: production
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      namespace: production
      name: order-service
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      namespace: production
      name: notification-service
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      namespace: production
      name: traffic-generator
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      namespace: external
      name: webhook-stub
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
