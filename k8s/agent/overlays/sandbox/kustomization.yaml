apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sandbox overlay — deploys the validation-agent into the sandbox GKE
# cluster brought up by scripts/sandbox-up.sh. NOT a generic productized
# overlay: it bakes in the sandbox project's Artifact Registry path, the
# sandbox `production` namespace where the test microservices live, and the
# sandbox Kubeshark install convention. A productized overlay (or, more
# likely, a Helm chart) would parameterize all of these.
resources:
  - ../../base
  - rbac.yaml

# Point the agent image at the sandbox project's Artifact Registry.
images:
  - name: validation-agent
    newName: us-central1-docker.pkg.dev/zugzwang-381922/validation/validation-agent
    newTag: latest

# Sandbox-specific patches:
#   - imagePullPolicy: Always (registry-backed cluster, mutable :latest tag)
#   - serviceAccountName: validation-agent (so the discovery loop can list services)
#   - PLATFORM_URL / COLLECTOR_URL / KUBESHARK_URL are placeholders that
#     scripts/sandbox-up.sh substitutes from Terraform outputs (Cloud Run URLs)
#     and the sandbox Kubeshark install location at apply time. The overlay
#     itself is environment-agnostic for those three values.
patches:
  - target:
      kind: Deployment
      namespace: validation
      name: validation-agent
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: validation-agent
        namespace: validation
      spec:
        template:
          spec:
            serviceAccountName: validation-agent
            containers:
              - name: agent
                imagePullPolicy: Always
                env:
                  - name: KUBESHARK_URL
                    value: "__KUBESHARK_URL__"
                  - name: PLATFORM_URL
                    value: "__PLATFORM_URL__"
                  - name: COLLECTOR_URL
                    value: "__COLLECTOR_URL__"
                  - name: API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: platform-api-key
                        key: jwt-token
