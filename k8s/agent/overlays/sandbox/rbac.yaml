# RBAC for the validation agent's service-discovery loop.
#
# Loop 1 lists Service resources in the `production` namespace (and any other
# namespace explicitly enumerated in DynamicConfig.namespaceFilters). Read-only;
# no mutation of any resource.
#
# The platform-api-key Secret is created out-of-band by scripts/seed-org.sh and
# is intentionally NOT managed by this overlay.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validation-agent
  namespace: validation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: validation-agent-services-reader
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "watch"]
---
# Bind the ClusterRole to the production namespace where the test services live.
# To discover services in additional namespaces, add another RoleBinding scoped
# to that namespace (or upgrade to a ClusterRoleBinding for cluster-wide read).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: validation-agent-services-reader
  namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: validation-agent-services-reader
subjects:
  - kind: ServiceAccount
    name: validation-agent
    namespace: validation
