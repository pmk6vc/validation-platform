# RBAC for the validation agent's service-discovery loop.
#
# Loop 1 lists Service resources in the `production` namespace (and any other
# namespace explicitly enumerated in DynamicConfig.namespaceFilters). Read-only;
# no mutation of any resource.
#
# The platform-api-key Secret is created out-of-band by scripts/seed-org.sh and
# is intentionally NOT managed by this overlay.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validation-agent
  namespace: validation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: validation-agent-services-reader
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "watch"]
---
# Cluster-wide read of Services. The agent's discovery loop calls
# `inAnyNamespace().list()` when DynamicConfig.namespaceFilters is empty
# (the default returned by /api/agent/config), which is a cluster-scoped
# LIST and requires a ClusterRoleBinding. System namespaces are filtered
# in the agent (see K8sServiceDiscovery.SYSTEM_NAMESPACES).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: validation-agent-services-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: validation-agent-services-reader
subjects:
  - kind: ServiceAccount
    name: validation-agent
    namespace: validation
