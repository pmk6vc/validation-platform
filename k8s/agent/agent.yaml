apiVersion: v1
kind: Namespace
metadata:
  name: validation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-agent
  namespace: validation
  labels:
    app: validation-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation-agent
  template:
    metadata:
      labels:
        app: validation-agent
    spec:
      containers:
        - name: agent
          image: validation-agent:latest
          imagePullPolicy: Never
          env:
            - name: KUBESHARK_URL
              value: "http://kubeshark-front.default.svc.cluster.local:80"
            - name: COLLECTOR_URL
              value: "http://collector.validation.svc.cluster.local:8081"
            - name: API_KEY
              value: "test-api-key"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
