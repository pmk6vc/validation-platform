# Envoy reverse proxy deployment.
#
# The envoy.yaml config is embedded in a ConfigMap and volume-mounted into the
# container, following the same pattern as the docker-compose deployment.
#
# Cluster DNS names: Services in the same namespace are reachable by short name
# (e.g. `platform`, `collector`) because Envoy's STRICT_DNS resolver appends the
# pod's search domain. Full FQDNs (platform.validation.svc.cluster.local) also work.
#
# The agent points PLATFORM_URL at http://envoy.validation.svc.cluster.local:8082.
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: validation
  labels:
    app: envoy
data:
  envoy.yaml: |
    # Envoy reverse proxy configuration for the validation platform.
    #
    # Responsibilities:
    #   - JWT validation (RS256) via remote JWKS from platform's /.well-known/jwks.json
    #   - Extracts organizationId, cluster, and role claims from the JWT
    #   - Forwards claims as X-Organization-Id, X-Cluster, X-Role headers to backends
    #   - Routes /api/captured-inputs/* to the collector, everything else under /api/* to platform
    #   - Health endpoint returns 200 directly (no upstream, no auth)
    #
    # No secrets in this file. Envoy fetches the RSA public key from the platform server.
    # The platform server reads the RSA private key from its own environment.

    static_resources:
      listeners:
        - name: platform_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8082
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: platform
                    codec_type: AUTO
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: platform
                          domains: ["*"]
                          routes:
                            # Health endpoint — direct response, no auth
                            - match:
                                path: "/health"
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "OK"
                              response_headers_to_add:
                                - header:
                                    key: content-type
                                    value: text/plain

                            # JWKS endpoint — pass through to platform, no auth
                            - match:
                                prefix: "/.well-known/"
                              route:
                                cluster: platform

                            # Collector routes
                            - match:
                                prefix: "/api/captured-inputs"
                              route:
                                cluster: collector

                            # Platform routes (everything else under /api/)
                            - match:
                                prefix: "/api/"
                              route:
                                cluster: platform

                            # Root
                            - match:
                                path: "/"
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "Validation Platform"

                    http_filters:
                      # JWT authentication filter
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            platform_jwt:
                              # Fetch RSA public key from the platform's JWKS endpoint.
                              # Same pattern as Google (googleapis.com/oauth2/v3/certs).
                              remote_jwks:
                                http_uri:
                                  uri: http://platform:8080/.well-known/jwks.json
                                  cluster: platform
                                  timeout: 5s
                                cache_duration: 300s
                              from_headers:
                                - name: Authorization
                                  value_prefix: "Bearer "
                              forward_payload_header: x-jwt-payload
                              claim_to_headers:
                                - header_name: X-Organization-Id
                                  claim_name: organizationId
                                - header_name: X-Cluster
                                  claim_name: cluster
                                - header_name: X-Role
                                  claim_name: role
                          rules:
                            # Skip auth for health, root, and JWKS
                            - match:
                                path: "/health"
                            - match:
                                path: "/"
                            - match:
                                prefix: "/.well-known/"
                            # Require JWT for all /api/* routes
                            - match:
                                prefix: "/api/"
                              requires:
                                provider_name: platform_jwt

                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: platform
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: platform
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: platform
                          port_value: 8080
          health_checks:
            - timeout: 2s
              interval: 10s
              unhealthy_threshold: 3
              healthy_threshold: 1
              http_health_check:
                path: /health

        - name: collector
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: collector
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: collector
                          port_value: 8081
          health_checks:
            - timeout: 2s
              interval: 10s
              unhealthy_threshold: 3
              healthy_threshold: 1
              http_health_check:
                path: /health

    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: validation
  labels:
    app: envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          args:
            - -c
            - /etc/envoy/envoy.yaml
          ports:
            - containerPort: 8082
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: validation
  labels:
    app: envoy
spec:
  selector:
    app: envoy
  ports:
    - port: 8082
      targetPort: 8082
