# Platform API key secret.
# In production, create this secret out-of-band (e.g., via `kubectl create secret`
# or a secrets manager). This file is a reference template with a placeholder value.
#
# The API key authenticates agents to the platform. The org/cluster fields scope
# the agent's view of services (e.g., targetServices in the config endpoint).
#
# Usage:
#   kubectl create secret generic platform-api-key \
#     --namespace=validation \
#     --from-literal=api-key=<your-secret> \
#     --from-literal=org-id=<organization-uuid> \
#     --from-literal=cluster=<cluster-name>
apiVersion: v1
kind: Secret
metadata:
  name: platform-api-key
  namespace: validation
type: Opaque
stringData:
  api-key: "change-me-in-production"
  org-id: "default-org"
  cluster: "validation-sandbox"
