# Platform secrets.
# In production, create this secret out-of-band (e.g., via `kubectl create secret`
# or a secrets manager). This file is a reference template with placeholder values.
#
# jwt-private-key: RSA private key (PEM format) for signing JWTs and serving JWKS.
#   Only the platform reads this. Envoy fetches the public key from the platform's JWKS endpoint.
# jwt-token: Pre-generated JWT for the agent. Generate with:
#   JWT_PRIVATE_KEY=<key> ./gradlew :platform:generateToken --args="--org <org-id> --cluster <cluster>"
# db-password: PostgreSQL password for platform and collector.
apiVersion: v1
kind: Secret
metadata:
  name: platform-api-key
  namespace: validation
type: Opaque
stringData:
  jwt-private-key: "change-me-in-production"
  jwt-token: "change-me-in-production"
  db-password: "change-me-in-production"
