# Docker Compose for integration tests.
# Stripped-down version of deploy/docker-compose.yaml without container_name
# (TestContainers doesn't support it).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d platform_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/platform_test
      DATABASE_USER: test
      DATABASE_PASSWORD: test
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.collector
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/platform_test
      DATABASE_USER: test
      DATABASE_PASSWORD: test
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  envoy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.envoy
    depends_on:
      app:
        condition: service_healthy
      collector:
        condition: service_healthy
    environment:
      JWT_SECRET: integration-test-secret
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
