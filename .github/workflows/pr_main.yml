name: PR checks (main)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew ktlintCheck

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit and integration tests
        run: ./gradlew shared:test app:test collector:test agent:test

      - name: Test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Unit Test Results
          files: |
            shared/build/test-results/test/TEST-*.xml
            app/build/test-results/test/TEST-*.xml
            collector/build/test-results/test/TEST-*.xml
            agent/build/test-results/test/TEST-*.xml

  e2e-tests:
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run e2e tests
        run: ./gradlew e2e-tests:test

      - name: Test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: E2E Test Results
          files: e2e-tests/build/test-results/test/TEST-*.xml
