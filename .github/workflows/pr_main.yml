name: PR checks (main)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew ktlintCheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :shared:test :app:test

      - name: Test summary
        if: always()
        run: |
          echo '## Test Results' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          for module in shared app collector; do
            dir="$module/build/test-results/test"
            [ -d "$dir" ] || continue
            echo "### $module" >> $GITHUB_STEP_SUMMARY
            passed=$(grep -rl 'failures="0" errors="0"' "$dir" 2>/dev/null | wc -l)
            failed=$(grep -rL 'failures="0" errors="0"' "$dir" --include='*.xml' 2>/dev/null | wc -l)
            total=$((passed + failed))
            if [ "$failed" -eq 0 ]; then
              echo ":white_check_mark: All $total test suites passed" >> $GITHUB_STEP_SUMMARY
            else
              echo ":x: $failed/$total test suites had failures" >> $GITHUB_STEP_SUMMARY
              grep -rh 'testcase.*name=' "$dir" | grep -v 'failures="0"' | head -20 >> $GITHUB_STEP_SUMMARY
            fi
            echo '' >> $GITHUB_STEP_SUMMARY
          done
