name: PR checks (main)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew ktlintCheck

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit and integration tests
        run: ./gradlew shared:test platform:test collector:test agent:test

      - name: Test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          comment_mode: off
          check_name: Unit Test Results
          files: |
            shared/build/test-results/test/TEST-*.xml
            platform/build/test-results/test/TEST-*.xml
            collector/build/test-results/test/TEST-*.xml
            agent/build/test-results/test/TEST-*.xml

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run e2e tests
        run: ./gradlew e2e-tests:test

      - name: Test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          comment_mode: off
          check_name: E2E Test Results
          files: e2e-tests/build/test-results/test/TEST-*.xml

  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/

      - name: Terraform validate (platform)
        run: |
          terraform -chdir=infra/platform init -backend=false
          terraform -chdir=infra/platform validate

      - name: Terraform validate (sandbox)
        run: |
          terraform -chdir=infra/sandbox init -backend=false
          terraform -chdir=infra/sandbox validate

  tap-test:
    # The vp-tap Go + eBPF module's pre-merge gate. Independent from the
    # Kotlin jobs above because the toolchain is different (Go + clang +
    # libbpf) but lives in the same workflow file so all PR checks are in
    # one place.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: tap/go.sum

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev

      - name: Install gotestsum
        # gotestsum runs `go test` and emits JUnit XML alongside the
        # normal stdout so the Test report step below can attach
        # per-test results to the PR check, same shape as the Kotlin
        # unit-tests job uses for Gradle's JUnit output.
        run: go install gotest.tools/gotestsum@latest

      - name: Tidy modules
        working-directory: tap
        run: go mod tidy

      - name: Generate BPF bindings
        working-directory: tap
        run: go generate ./internal/ebpf/...

      - name: Go vet
        working-directory: tap
        run: go vet ./...

      - name: Go test
        working-directory: tap
        # --format=testname: print each PASS/FAIL line in CI log
        # --junitfile: write JUnit XML for the Test report step
        # -race: enable the data-race detector
        # -count=1: defeat the test result cache so re-runs of the same
        #   commit actually re-execute the tests
        run: gotestsum --format=testname --junitfile=junit.xml -- -race -count=1 ./...

      - name: Test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          comment_mode: off
          check_name: Tap Test Results
          files: tap/junit.xml
