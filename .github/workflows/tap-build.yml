name: tap build

# The vp-tap module is an independent Go + eBPF subtree under tap/. Triggers
# only on changes to that subtree (or this workflow file) so it doesn't
# block Kotlin-only PRs.

on:
  pull_request:
    paths:
      - 'tap/**'
      - '.github/workflows/tap-build.yml'
  push:
    branches: [main]
    paths:
      - 'tap/**'
      - '.github/workflows/tap-build.yml'

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: tap/go.sum

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev

      - name: Tidy modules
        working-directory: tap
        run: go mod tidy

      - name: Generate BPF bindings
        working-directory: tap
        run: go generate ./internal/ebpf/...

      - name: Go test
        working-directory: tap
        run: go test ./...

      - name: Go build (static linux/amd64)
        working-directory: tap
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o vp-tap ./cmd/vp-tap

      - name: Verify static binary
        working-directory: tap
        run: |
          file vp-tap
          # ELF + statically linked + linux/amd64
          file vp-tap | grep -q 'ELF 64-bit LSB executable, x86-64'
          file vp-tap | grep -qE 'statically linked|static-pie'

      - name: Docker build (image-size gate)
        working-directory: tap
        run: |
          docker build -t vp-tap:ci .
          # TAP-2 validation criterion: image must be < 30 MB.
          size_bytes=$(docker image inspect vp-tap:ci --format '{{.Size}}')
          size_mb=$((size_bytes / 1024 / 1024))
          echo "vp-tap:ci image size = ${size_mb} MB (${size_bytes} bytes)"
          if [ "$size_mb" -ge 30 ]; then
            echo "image size ${size_mb} MB exceeds 30 MB ceiling"
            exit 1
          fi
