name: Build, push, and deploy (main)

# Runs on every merge to main. Builds the platform and collector images,
# pushes them to Artifact Registry, then rolls out new Cloud Run revisions
# via `gcloud run services update`.
#
# Why not terraform apply: a full apply needs broad project-level admin roles
# (cloudsql, secretmanager, projectIamAdmin, workloadIdentityPoolAdmin, …) on
# the cicd SA. Image rollout only needs run.developer + iam.serviceAccountUser.
# Infra changes are applied manually via scripts/platform-{up,down}.sh.

on:
  push:
    branches: [main]

permissions:
  id-token: write  # required for Workload Identity Federation OIDC token
  contents: read

env:
  REGISTRY: us-central1-docker.pkg.dev/zugzwang-381922/validation
  REGION: us-central1

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- GCP authentication via Workload Identity Federation ---
      # No JSON key file is used. The OIDC token issued by GitHub Actions is
      # exchanged for a short-lived GCP access token that impersonates the
      # validation-cicd-sa service account.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # --- Build and push platform image ---
      - name: Build platform image
        run: |
          docker build \
            -f deploy/Dockerfile.platform \
            -t ${{ env.REGISTRY }}/platform:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/platform:latest \
            .

      - name: Push platform image
        run: |
          docker push ${{ env.REGISTRY }}/platform:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/platform:latest

      # --- Build and push collector image ---
      - name: Build collector image
        run: |
          docker build \
            -f deploy/Dockerfile.collector \
            -t ${{ env.REGISTRY }}/collector:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/collector:latest \
            .

      - name: Push collector image
        run: |
          docker push ${{ env.REGISTRY }}/collector:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/collector:latest

      # --- Build and push test-service images via Jib ---
      # Test services don't have hand-written Dockerfiles; they ship as Jib
      # builds. They land in the sandbox cluster (deployed by sandbox-up.sh,
      # which pulls :latest from Artifact Registry).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and push test-service images
        run: |
          for svc in api-gateway order-service notification-service traffic-generator webhook-stub; do
            module="test-services:${svc}"
            image="${{ env.REGISTRY }}/test-${svc}"
            ./gradlew ":${module}:jib" \
              -Djib.to.image="${image}" \
              -Djib.to.tags="latest,${{ github.sha }}" \
              -Djib.to.auth.username=oauth2accesstoken \
              -Djib.to.auth.password="$(gcloud auth print-access-token)" \
              -Djib.arch=amd64
          done

      # --- Roll out new Cloud Run revisions ---
      # Using the SHA-tagged images (not :latest) so each revision is pinned
      # to a specific build and rollbacks are deterministic.
      - name: Deploy validation-platform
        run: |
          gcloud run services update validation-platform \
            --image=${{ env.REGISTRY }}/platform:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --quiet

      - name: Deploy validation-collector
        run: |
          gcloud run services update validation-collector \
            --image=${{ env.REGISTRY }}/collector:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --quiet
