name: tap build & push (main)

# Post-merge image production for the vp-tap module. Mirrors push_main.yml's
# pattern: build and push the image to Artifact Registry on every merge to
# main, no tests (PR already gated on tap-pr.yml). Path-filtered to tap/**
# so Kotlin-only merges don't trigger a Go build.
#
# This workflow is what `scripts/sandbox-up.sh` relies on for the :latest
# tag in Artifact Registry — same convention as the Kotlin modules.

on:
  push:
    branches: [main]
    paths:
      - 'tap/**'
      - '.github/workflows/tap-push.yml'

permissions:
  id-token: write  # required for Workload Identity Federation OIDC token
  contents: read

env:
  REGISTRY: us-central1-docker.pkg.dev/zugzwang-381922/validation
  IMAGE_NAME: vp-tap

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # GCP authentication via Workload Identity Federation (same shape as
      # push_main.yml). No JSON key file.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        working-directory: tap
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
