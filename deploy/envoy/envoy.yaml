# Envoy reverse proxy configuration for the validation platform.
#
# Responsibilities:
#   - JWT validation (RS256) via remote JWKS from the platform's /.well-known/jwks.json
#   - Extracts organizationId, cluster, and role claims from the JWT
#   - Forwards claims as X-Organization-Id, X-Cluster, X-Role headers to backends
#   - Routes /api/captured-inputs/* to the collector, everything else under /api/* to the platform
#   - Health endpoint returns 200 directly (no upstream, no auth)
#
# No secrets in this file. Envoy fetches the RSA public key from the platform service.
# The platform service reads the RSA private key from its own environment.
#
# Usage:
#   docker-compose: volume-mounted from deploy/envoy/envoy.yaml
#   K8s: stored in a ConfigMap

static_resources:
  listeners:
    - name: platform_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8082
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: platform
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: platform
                      domains: ["*"]
                      routes:
                        # Health endpoint — direct response, no auth
                        - match:
                            path: "/health"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "OK"
                          response_headers_to_add:
                            - header:
                                key: content-type
                                value: text/plain

                        # JWKS endpoint — pass through to platform, no auth
                        - match:
                            prefix: "/.well-known/"
                          route:
                            cluster: platform

                        # Collector routes
                        - match:
                            prefix: "/api/captured-inputs"
                          route:
                            cluster: collector

                        # Platform routes (everything else under /api/)
                        - match:
                            prefix: "/api/"
                          route:
                            cluster: platform

                        # Root
                        - match:
                            path: "/"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "Validation Platform"

                http_filters:
                  # JWT authentication filter
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        platform_jwt:
                          # Fetch RSA public key from the platform's JWKS endpoint.
                          # Same pattern as Google (googleapis.com/oauth2/v3/certs).
                          remote_jwks:
                            http_uri:
                              uri: http://platform:8080/.well-known/jwks.json
                              cluster: platform
                              timeout: 5s
                            cache_duration: 300s
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          # Keep the Authorization header so the platform's
                          # in-app JWT validator (installJwtAuth) can re-check.
                          # Removed in PR E once Envoy is gone entirely.
                          forward: true
                          forward_payload_header: x-jwt-payload
                          claim_to_headers:
                            - header_name: X-Organization-Id
                              claim_name: organizationId
                            - header_name: X-Cluster
                              claim_name: cluster
                            - header_name: X-Role
                              claim_name: role
                      rules:
                        # Skip auth for health, root, and JWKS
                        - match:
                            path: "/health"
                        - match:
                            path: "/"
                        - match:
                            prefix: "/.well-known/"
                        # Require JWT for all /api/* routes
                        - match:
                            prefix: "/api/"
                          requires:
                            provider_name: platform_jwt

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: platform
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: platform
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: platform
                      port_value: 8080
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /health

    - name: collector
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: collector
                      port_value: 8081
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /health

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
